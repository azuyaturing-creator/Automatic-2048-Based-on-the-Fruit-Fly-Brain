[project]
name = "flybrain-sim"
version = "0.1.0"
description = "Fruit fly connectome spiking network playing 2048 (Brian2 + A2C readout, with an interactive web lab and human teaching)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "brian2>=2.10.1",
    "matplotlib>=3.8",
    "navis>=1.12.0",
    "neuprint-python>=0.6.3",
    "numpy>=1.26",
    "pandas>=2.0",
    "requests>=2.31",
]
